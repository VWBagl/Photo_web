<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фотоконкурс{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Шапка с динамической навигацией -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="{% url 'photo_gallery' %}">📸 Фотоконкурс</a>

            <nav class="navbar-nav">
                {% if user.is_authenticated %}
                <!-- Блок для авторизованного пользователя -->
                <span class="navbar-text text-light me-3">
                    👤 {{ user.username }}
                </span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Выйти</a>
                {% else %}
                <!-- Блок для гостя -->
                <a href="{% url 'auth' %}" class="btn btn-outline-light btn-sm me-2">Войти</a>
                <a href="{% url 'registration' %}" class="btn btn-primary btn-sm">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </nav>

    <!-- Основной контент + сообщения -->
    <main class="container flex-grow-1">
        {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2 px-3">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Футер  -->
    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center text-muted">
            &copy; {% now "Y" %} Фотоконкурс
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
